# OpsAI-IT 本地开发环境：PostgreSQL + Django 开发服务
# 在仓库根目录执行（命令见 README）：
#   docker compose --env-file .env -f deploy/compose.yaml up -d
# 固定项目名，避免与其他项目的 deploy/ 目录同名产生资源冲突
name: opsai-it

services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      # 容器内 Django 通过服务名连接数据库；宿主机 Django 仍使用 .env 中的 localhost
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
