# KB-MULTI-FORMAT-IMPORT-01: new volumes and isolated network only.
name: opsai-multi-import-acceptance-01

x-acceptance-labels: &acceptance-labels
  com.opsai.environment: multi-import-acceptance
  com.opsai.task: KB-MULTI-FORMAT-IMPORT-01
  com.opsai.authorized-head: ${MULTI_IMPORT_AUTHORIZED_HEAD:?MULTI_IMPORT_AUTHORIZED_HEAD is required}

services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${MULTI_IMPORT_POSTGRES_DB:?MULTI_IMPORT_POSTGRES_DB is required}
      POSTGRES_USER: ${MULTI_IMPORT_POSTGRES_USER:?MULTI_IMPORT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${MULTI_IMPORT_POSTGRES_PASSWORD:?MULTI_IMPORT_POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [acceptance]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    labels: *acceptance-labels

  clamd:
    image: clamav/clamav:1.4.3
    volumes:
      - clamdb:/var/lib/clamav
    networks: [acceptance]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version"]
      interval: 15s
      timeout: 10s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    labels: *acceptance-labels

  media-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.multi-import-acceptance
      additional_contexts:
        wheelhouse: ${MULTI_IMPORT_WHEELHOUSE:?MULTI_IMPORT_WHEELHOUSE is required}
    image: opsai-multi-import-acceptance-01-web:${MULTI_IMPORT_IMAGE_TAG:?MULTI_IMPORT_IMAGE_TAG is required}
    user: "0:0"
    command: ["sh", "-c", "chown -R appuser:appuser /app/private_media"]
    volumes:
      - private_media:/app/private_media
    network_mode: none
    restart: "no"
    labels: *acceptance-labels

  static-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.multi-import-acceptance
      additional_contexts:
        wheelhouse: ${MULTI_IMPORT_WHEELHOUSE:?MULTI_IMPORT_WHEELHOUSE is required}
    image: opsai-multi-import-acceptance-01-web:${MULTI_IMPORT_IMAGE_TAG:?MULTI_IMPORT_IMAGE_TAG is required}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${MULTI_IMPORT_DJANGO_SECRET_KEY:?MULTI_IMPORT_DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost:${MULTI_IMPORT_HTTPS_PORT:?MULTI_IMPORT_HTTPS_PORT is required}
      POSTGRES_DB: ${MULTI_IMPORT_POSTGRES_DB:?MULTI_IMPORT_POSTGRES_DB is required}
      POSTGRES_USER: ${MULTI_IMPORT_POSTGRES_USER:?MULTI_IMPORT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${MULTI_IMPORT_POSTGRES_PASSWORD:?MULTI_IMPORT_POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      KNOWLEDGE_MEDIA_CLAMD_HOST: clamd
      KNOWLEDGE_MEDIA_CLAMD_PORT: "3310"
      KNOWLEDGE_MEDIA_CLAMD_TIMEOUT_SECONDS: "30"
    user: "0:0"
    command: ["python", "manage.py", "collectstatic", "--noinput"]
    volumes:
      - staticfiles:/app/staticfiles
    networks: [acceptance]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    labels: *acceptance-labels

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.multi-import-acceptance
      additional_contexts:
        wheelhouse: ${MULTI_IMPORT_WHEELHOUSE:?MULTI_IMPORT_WHEELHOUSE is required}
    image: opsai-multi-import-acceptance-01-web:${MULTI_IMPORT_IMAGE_TAG:?MULTI_IMPORT_IMAGE_TAG is required}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${MULTI_IMPORT_DJANGO_SECRET_KEY:?MULTI_IMPORT_DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost:${MULTI_IMPORT_HTTPS_PORT:?MULTI_IMPORT_HTTPS_PORT is required}
      POSTGRES_DB: ${MULTI_IMPORT_POSTGRES_DB:?MULTI_IMPORT_POSTGRES_DB is required}
      POSTGRES_USER: ${MULTI_IMPORT_POSTGRES_USER:?MULTI_IMPORT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${MULTI_IMPORT_POSTGRES_PASSWORD:?MULTI_IMPORT_POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      KNOWLEDGE_MEDIA_CLAMD_HOST: clamd
      KNOWLEDGE_MEDIA_CLAMD_PORT: "3310"
      KNOWLEDGE_MEDIA_CLAMD_TIMEOUT_SECONDS: "30"
    ports:
      - "127.0.0.1:${MULTI_IMPORT_WEB_PORT:?MULTI_IMPORT_WEB_PORT is required}:8000"
    volumes:
      - private_media:/app/private_media
    networks: [acceptance]
    depends_on:
      db:
        condition: service_healthy
      clamd:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    security_opt: ["no-new-privileges:true"]
    labels: *acceptance-labels

  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:${MULTI_IMPORT_HTTPS_PORT:?MULTI_IMPORT_HTTPS_PORT is required}:443"
    volumes:
      - ./Caddyfile.multi-import-acceptance:/etc/caddy/Caddyfile:ro
      - staticfiles:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [acceptance]
    depends_on:
      web:
        condition: service_started
      static-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt: ["no-new-privileges:true"]
    labels: *acceptance-labels

volumes:
  postgres_data:
    name: opsai-multi-import-acceptance-01-postgres
    labels: *acceptance-labels
  clamdb:
    name: opsai-multi-import-acceptance-01-clamdb
    labels: *acceptance-labels
  private_media:
    name: opsai-multi-import-acceptance-01-private-media
    labels: *acceptance-labels
  staticfiles:
    name: opsai-multi-import-acceptance-01-staticfiles
    labels: *acceptance-labels
  caddy_data:
    name: opsai-multi-import-acceptance-01-caddy-data
    labels: *acceptance-labels
  caddy_config:
    name: opsai-multi-import-acceptance-01-caddy-config
    labels: *acceptance-labels

networks:
  acceptance:
    name: opsai-multi-import-acceptance-01-network
    labels: *acceptance-labels
