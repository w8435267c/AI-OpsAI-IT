[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opsai-it"
version = "0.1.0"
description = "面向企业内部员工的IT运维知识库"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.8,<5",
    "ruff>=0.9,<1",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "docs/05-Database/knowledge_models_reference.py",
    # Django 自动生成的迁移文件不做行长检查
    "apps/*/migrations/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra"
